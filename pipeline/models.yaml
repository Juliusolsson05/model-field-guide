# The allowlist. The ONLY place model identity is defined.
#
# Why a hand-kept map: no two sources share an id. Epoch groups by a display
# family ("GPT-6 Astra") with effort suffixes on version ids, LMArena uses
# free-text names that drift ("GPT 6 Astra (Max)" vs "gpt-6-astra-max"),
# models.dev uses <provider>/<api id>, Steel uses vendor marketing names.
# Matching by fuzzy string would silently merge "claude-opus-5" into
# "claude-opus-5-5", so every mapping is explicit and reviewed by a human.
#
# Fields:
#   id        our stable id == the vendor API id where one exists
#   tier      frontier | open-frontier | value | fast-cheap | legacy
#   expect    sources that MUST contain this model; if one loses it the nightly
#             FAILS (catches an upstream rename silently dropping a model).
#             Everything else may be absent (a model released today is not in
#             Epoch yet) and renders as "n/a".
#   sources:
#     models_dev   "<provider>/<model>" key in models.dev api.json
#     epoch        Epoch model_group (also the ECI "Model" column)
#     lmarena      normalized base names (lowercase, spaces->'-'); a row matches
#                  when its normalized name == base, or base + "-" + effort
#                  words / snapshot date. See pipeline/parse/lmarena.py.
#     tau2         tau2-bench submission "model_name" values
#     steel        Steel leaderboard systemName prefixes (vendor-reported)

models:
  - id: claude-opus-5-5
    display: Claude Opus 5.5
    lab: Anthropic
    tier: frontier
    expect: [models_dev]
    sources:
      models_dev: anthropic/claude-opus-5-5
      epoch: Claude Opus 5.5
      lmarena: [claude-opus-5.5, claude-opus-5-5]
      steel: [Claude Opus 5.5]

